services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: darglobal-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persistent volume mapping for scraped assets, processed entities, and ChromaDB vector store
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - darglobal-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: darglobal-frontend
    restart: unless-stopped
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - darglobal-net

networks:
  darglobal-net:
    driver: bridge
